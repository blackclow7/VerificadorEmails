name: Compilar VerificadorEmails.exe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "desktop/verifier_app.py"
      - ".github/workflows/build-exe.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          pip install requests dnspython openpyxl pyinstaller

      - name: Compilar el .exe
        working-directory: desktop
        run: |
          pip install pyinstaller
          pyinstaller --onefile --windowed --name VerificadorEmails `
            --hidden-import=dns `
            --hidden-import=dns.resolver `
            --hidden-import=dns.rdatatype `
            --hidden-import=dns.rdataclass `
            --hidden-import=dns.name `
            --hidden-import=dns.message `
            --hidden-import=dns.query `
            --hidden-import=dns.exception `
            --hidden-import=dns.rdtypes `
            --hidden-import=dns.rdtypes.ANY `
            --hidden-import=dns.rdtypes.ANY.MX `
            --hidden-import=dns.rdtypes.mxbase `
            --collect-all=dns `
            verifier_app.py

      - name: Subir el .exe como resultado descargable
        uses: actions/upload-artifact@v4
        with:
          name: VerificadorEmails-windows
          path: desktop/dist/VerificadorEmails.exe
