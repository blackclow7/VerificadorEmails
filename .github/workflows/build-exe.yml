name: Compilar VerificadorEmails.exe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "desktop/verifier_app.py"
      - "desktop/installer.iss"
      - ".github/workflows/build-exe.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias Python
        run: |
          pip install requests openpyxl keyring pyinstaller

      - name: Compilar el .exe con PyInstaller
        working-directory: desktop
        run: |
          pyinstaller --onefile --windowed --name VerificadorEmails verifier_app.py

      - name: Instalar Inno Setup
        run: |
          choco install innosetup --yes

      - name: Compilar instalador con Inno Setup
        run: |
          iscc "desktop/installer.iss"

      - name: Subir instalador como resultado descargable
        uses: actions/upload-artifact@v4
        with:
          name: VerificadorEmails-Instalador-Windows
          path: desktop\Output\VerificadorEmails_Setup.exe
