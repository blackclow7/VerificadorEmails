name: Compilar APK Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar dependencias de Capacitor
        working-directory: mobile
        run: npm install && npm install -D typescript

      - name: Sincronizar Capacitor con el proyecto Android
        working-directory: mobile
        run: npx cap sync android

      - name: Dar permisos de ejecución a gradlew
        working-directory: mobile/android
        run: chmod +x gradlew

      - name: Compilar el APK (debug, instalable directo)
        working-directory: mobile/android
        run: ./gradlew assembleDebug

      - name: Subir el APK como resultado descargable
        uses: actions/upload-artifact@v4
        with:
          name: GreenEmailVerifier-Android-APK
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
